# Builds installers for Windows, macOS and Linux on every push and pull request
# (downloadable from the run's artifacts). Pushing a tag such as v0.4.0 also
# publishes them as a GitHub Release, with the notes from CHANGELOG.md.
name: Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  package:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, target: --win }
          - { name: macOS, os: macos-latest, target: --mac }
          - { name: Linux, os: ubuntu-latest, target: --linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm test
      - run: npm run build
      - name: Package
        # Unsigned: Windows builds carry no certificate, macOS builds are
        # ad-hoc signed (package.json build.mac.identity).
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Itypora-${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb

  desktop-tests:
    name: Desktop tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Integration tests
        shell: bash
        run: |
          run() { if [ "$RUNNER_OS" = Linux ]; then xvfb-run --auto-servernum node "$@"; else node "$@"; fi; }
          for test in desktop preferences sidebar; do run "tests/$test.mjs"; done

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" 'index($0, "## ") == 1 { found = index($0, heading) == 1; next } found' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See [CHANGELOG.md](CHANGELOG.md)." > notes.md
          cat .github/release-footer.md >> notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Itypora ${{ github.ref_name }}
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: artifacts/*
