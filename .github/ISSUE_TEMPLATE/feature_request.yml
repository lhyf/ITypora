name: 功能建议 / Feature request
description: 建议新功能或改进 / Suggest a feature or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / Problem
      description: 你在做什么时遇到了不便？ What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法 / Proposal
      description: 如果 Typora 中有类似功能，可以描述它的行为。 If Typora has something similar, describe how it behaves there.
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案 / Alternatives
