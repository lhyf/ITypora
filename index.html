<!doctype html>
<!-- Match Typora's window (lang="en"): the language selects CJK punctuation
     glyphs (e.g. the em dash) and the font behind generic sans-serif. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' data:; img-src 'self' data: blob: itypora-asset:; font-src 'self' data: itypora-asset:; connect-src 'self'; media-src 'self' itypora-asset:; object-src 'none'; base-uri 'none'; frame-src 'none'" />
    <title>Itypora</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
